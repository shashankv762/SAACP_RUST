[package]
name = "saacp"
version = "0.1.0"
edition = "2021"
description = "Secure Autonomous Agent Communication Protocol - Rust Implementation"
license = "MIT"

[dependencies]
aes-gcm = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: H-6 fix uncovered that without it, `serde_json::from_str`
# can lose a few ULPs of precision on high-precision f64 values (e.g. our
# sub-second audit-log timestamps), so parse(print(x)) != x in rare cases —
# breaking `ImmutableAuditLog::verify_chain`/`verify_chain_disk`'s HMAC
# recomputation, which re-serializes a parsed `serde_json::Value` and expects
# byte-identical output to the original canonical serialization.
serde_json = { version = "1", features = ["float_roundtrip"] }
uuid = { version = "1", features = ["v4"] }
# IoT / low-resource fix: "full" pulled in signal/process/fs/io-std — none of
# which src/ actually uses (only daemon.rs and transport/ws.rs touch tokio, and
# only via spawn/spawn_blocking, TcpListener, AsyncRead/WriteExt, timeout, and
# sync::Semaphore for the CRIT-9 connection limiter — verified by grep across
# src/). Trimming to just what's used cuts compile time and binary size for
# embedded-Linux-class deployments (Raspberry Pi / OpenWrt-class routers)
# without losing any functionality. Left at "full" in [dev-dependencies] below
# since dev-deps never ship to downstream consumers of this library crate.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
# M-15/R-2 fix: `CancellationToken` for graceful shutdown (`daemon.rs`, `transport/ws.rs`,
# `transport/tls.rs`, `sidecar.rs`, `command_center.rs`) — a plain (non-optional) dependency
# since `daemon.rs` is unconditionally compiled. `default-features = false` since none of
# tokio-util's optional feature-gated modules (`codec`/`io`/`net`/`rt`/`time`) are used here,
# only `sync::CancellationToken`, which is not behind any of them.
tokio-util = { version = "0.7", default-features = false }
base64 = "0.22"
adler2 = "2"
unicode-normalization = "0.1"
rand = "0.8"
hex = "0.4"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
# L-18 fix: `SharedCircuitBreakers` (daemon.rs) used `std::sync::Mutex`, which is fragile
# in an async context — the lock is only ever held across small synchronous sections today,
# but nothing stops a future edit from adding an `.await` inside one of those sections and
# silently reintroducing executor-starvation/deadlock risk with no compiler warning.
# `parking_lot::Mutex` also never poisons, eliminating the `.unwrap_or_else(|e| e.into_inner())`
# poison-recovery boilerplate (H-22) this same lock previously needed.
parking_lot = "0.12"
aho-corasick = "1"
flate2 = "1"
tokio-tungstenite = { version = "0.24", optional = true }
bytes = { version = "1", optional = true }
futures-util = { version = "0.3", optional = true, default-features = false }
redis = { version = "0.27", optional = true }
axum = { version = "0.7", optional = true }
# TLS-wrapped raw-TCP transport (src/transport/tls.rs) — TLS-terminates an accepted
# TcpStream, then hands the resulting rustls TlsStream directly to the existing generic
# `daemon::handle_client` (no adapter needed, unlike `WsByteStream` — `TlsStream` already
# implements `AsyncRead + AsyncWrite + Unpin + Send`). Both `rustls` (0.23) and
# `tokio-rustls` (0.26) already resolve in this crate's dependency tree transitively (via
# `reqwest`'s dev-only `rustls-tls` feature), so pinning the same major versions here as a
# real, non-dev, optional dependency adds no version conflict.
tokio-rustls = { version = "0.26", optional = true }
rustls-pemfile = { version = "2", optional = true }

# ── Hardware Root of Trust backends (src/hrt/) ──────────────────────────────────
# All three are optional and off by default; see the `hrt-*` feature comments below.
#
# PKCS#11. `cryptoki` is a safe wrapper over the C PKCS#11 API and is natively
# synchronous, so the `HardwareKeyStore` trait's synchronous `sign` maps onto it
# directly with no runtime bridge. Note `cryptoki::session::Session` is deliberately
# `!Sync` (the C API forbids concurrent use of one session), which is why
# `Pkcs11KeyStore` holds it behind a `Mutex` — see that module's doc.
cryptoki = { version = "0.12", optional = true }
# AWS KMS. `aws-config` supplies the standard credential-provider chain (env,
# profile, IMDS, IRSA) so this crate never handles AWS credentials itself.
aws-sdk-kms = { version = "1", optional = true }
aws-config = { version = "1", optional = true, features = ["behavior-version-latest"] }
# GCP KMS. `gcloud-sdk` is used rather than a hand-rolled REST client because it
# carries the Application Default Credentials chain (service-account JSON, workload
# identity, metadata server) that a production GCP deployment expects.
gcloud-sdk = { version = "0.30", optional = true, default-features = false, features = [
    "google-cloud-kms-v1",
    "tls-roots",
] }

[features]
default = []
# WebSocket tunneling transport (src/transport/ws.rs) — tunnels SAACP MEASC
# binary frames inside WebSocket binary messages so the protocol survives
# HTTP-only corporate proxies / API gateways / CDNs. Off by default so a
# plain TCP-only deployment never pulls in tokio-tungstenite.
transport-ws = ["dep:tokio-tungstenite", "dep:bytes", "dep:futures-util"]
# TLS-wrapped raw-TCP transport (src/transport/tls.rs) — deliberately raw TCP+TLS only,
# not WebSocket-over-TLS (wss://); that's a distinct future combination requiring
# `transport/ws.rs::serve_ws_connection` to be genericized over the stream type. Off by
# default so a deployment that doesn't need in-protocol TLS termination (e.g. one that
# already terminates TLS at a reverse proxy in front of the raw MEASC listener) never
# pulls in rustls.
transport-tls = ["dep:tokio-rustls", "dep:rustls-pemfile"]
# Redis-backed StateBackend (src/state_backend.rs) — lets a horizontally
# scaled fleet of SAACP gateways share rate-limiter/session/stream state
# across nodes instead of each node holding an isolated in-memory view. Off
# by default so a single-node deployment never pulls in the redis crate.
redis-backend = ["dep:redis"]
# Metadata Privacy Filter (src/mpf.rs) — cover traffic, adaptive padding, and
# timing-jitter recommendations for traffic-analysis resistance. This is not,
# and never has been, wired into the mandatory gate pipeline (it's opt-in
# caller-invoked utility code) — matters far more for anonymity-network threat
# models than for AI agent pipelines running inside a controlled
# infrastructure boundary. Off by default so IoT/low-resource builds don't
# even compile it; enable explicitly if your deployment's threat model
# includes passive traffic analysis.
mpf = []
# Python/HTTP sidecar proxy (src/sidecar.rs + the `saacp-sidecar` binary) — lets a
# Python (or any HTTP-capable) agent get SAACP's crypto/gate-pipeline guarantees over
# plain localhost HTTP/JSON, with zero SAACP protocol knowledge on the Python side. Off
# by default so a library-only deployment never pulls in axum; also the first feature
# to add a `[[bin]]` target to this otherwise library-only crate.
sidecar = ["dep:axum"]
# SAACP Command Center dashboard backend (src/command_center.rs + the
# `saacp-command-center` binary) — a REST + Server-Sent-Events API surfacing
# live agent trust scores, the trust-mesh delegation graph, security alerts,
# and Financial Circuit Breaker activity for a web dashboard. Off by default,
# same rationale as `sidecar`. Adds ZERO new dependencies — reuses the
# already-optional `axum` (also pulled in by `sidecar`) and `futures-util`
# (for `futures_util::stream::unfold`, used to turn a `tokio::sync::broadcast`
# receiver into an SSE `Stream` without pulling in `tokio-stream`).
command-center = ["dep:axum", "dep:futures-util"]
# UNSAFE: exposes framing::MEASCFrame::parse_header_structural, which preserves
# the PRE-CRIT-1-FIX behavior — structural header parsing with ZERO AES-GCM
# authentication. Off by default and MUST remain off in every real deployment;
# it exists solely as an explicit, auditable escape hatch for local wire-format
# / interop debugging tooling that needs to inspect MEASCFrame headers without
# possessing the session key. No test in this crate's default test suite
# requires it — every test that previously relied on the unauthenticated
# structural path was migrated to build genuinely-encrypted frames via
# `encode_encrypted` instead. See CRIT-1 in opusplan.md.
unsafe-structural-only = []
# Hardware Root of Trust (src/hrt/, Phase 6 / item 8 / Part 8.8) — hardware-backed
# `HardwareKeyStore` implementations, so a long-lived signing key can live inside a
# device that never releases it rather than in this process's address space.
#
# The default build stays lightweight and dependency-free: `SoftwareKeyStore` (the
# default `HardwareKeyStore` impl, delegating to `klms::KeyRegistry`) needs nothing
# extra. Each backend below is off by default because each pulls a substantial and
# entirely optional dependency tree, and because a deployment that does not have the
# corresponding hardware must never accidentally compile — let alone silently depend
# on — a backend it cannot use.
#
# PKCS#11 (`cryptoki`) is the backend for on-premise banking/defense environments:
# Thales/Entrust/Utimaco network HSMs, YubiHSM, and SoftHSM2 for testing. It is
# natively synchronous, so it needs no runtime bridge.
hrt-pkcs11 = ["dep:cryptoki"]
# AWS KMS. Requires an `ECC_NIST_EDWARDS25519` / SIGN_VERIFY key; AWS added Ed25519
# (EdDSA) support in November 2025, exposed in the Rust SDK as
# `SigningAlgorithmSpec::Ed25519Sha512`.
hrt-aws-kms = ["dep:aws-sdk-kms", "dep:aws-config"]
# Google Cloud KMS. Requires an `EC_SIGN_ED25519` (ASYMMETRIC_SIGN) key version.
# Ed25519 in Cloud KMS is "pure mode": the request carries the raw message in `data`,
# never a pre-computed digest.
hrt-gcp-kms = ["dep:gcloud-sdk"]
# TPM 2.0 and Intel SGX remain compile-only placeholders returning
# `HrtError::NotImplemented`. Unlike PKCS#11/KMS above, neither has a mature,
# maintained, pure-Rust integration path that can be implemented and *tested* here:
# TPM signing key provisioning is platform-specific, and SGX requires an enclave
# build toolchain. The flags exist so the trait seam and feature wiring are already
# in place when that work happens.
hrt-tpm = []
hrt-sgx = []

[dev-dependencies]
serial_test = "3"
criterion = { version = "0.5", features = ["html_reports"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# Self-signed cert generation for tests/test_transport_tls_rs.rs only — never a runtime
# dependency of the library itself (SAACPTlsDaemon takes an already-built
# `rustls::ServerConfig`; see `transport::tls::load_tls_config`/`server_config_from_cert_and_key`).
rcgen = "0.13"

[[bench]]
name = "benchmarks"
harness = false

[[test]]
name = "test_transport_ws_rs"
path = "tests/test_transport_ws_rs.rs"
required-features = ["transport-ws"]

[[test]]
name = "test_shared_circuit_breaker_rs"
path = "tests/test_shared_circuit_breaker_rs.rs"
required-features = ["transport-ws"]

[[test]]
name = "test_transport_tls_rs"
path = "tests/test_transport_tls_rs.rs"
required-features = ["transport-tls"]

[[test]]
name = "test_sidecar_rs"
path = "tests/test_sidecar_rs.rs"
required-features = ["sidecar"]

[[test]]
name = "test_redis_backend_rs"
path = "tests/test_redis_backend_rs.rs"
required-features = ["redis-backend"]

[[test]]
name = "test_command_center_rs"
path = "tests/test_command_center_rs.rs"
required-features = ["command-center"]

# The crate's first binary target — a standalone local HTTP sidecar proxy so
# non-Rust (e.g. Python) agents can get SAACP's security guarantees over plain
# HTTP/JSON without any SAACP protocol knowledge. See src/sidecar.rs.
[[bin]]
name = "saacp-sidecar"
path = "src/bin/saacp_sidecar.rs"
required-features = ["sidecar"]

# SAACP Command Center dashboard backend binary — a standalone REST+SSE HTTP
# server exposing live gateway security telemetry to the dashboard-ui
# frontend. See src/command_center.rs.
[[bin]]
name = "saacp-command-center"
path = "src/bin/saacp_command_center.rs"
required-features = ["command-center"]

# High-performance / low-resource fix: no release profile existed at all, so
# "high performance" was asserted without any tuning to back it. Deliberately
# NOT setting `panic = "abort"` — this crate has ~70+ internal
# `.lock().unwrap()` calls and runs as a long-lived network daemon;
# abort-on-panic would turn one attacker-triggered panic in one connection
# into a full-process crash for every other connection too, which is worse
# for availability, not better.
[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
