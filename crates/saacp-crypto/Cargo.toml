[package]
name = "saacp-crypto"
version = "0.2.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SAACP cryptographic core — FIPS boundary. MEASC framing, audit log, PQC, HRT, attestation."

[dependencies]
saacp-primitives = { workspace = true }
aes-gcm = { workspace = true }
ed25519-dalek = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
x25519-dalek = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }
parking_lot = { workspace = true }
arc-swap = { workspace = true }
flate2 = { workspace = true }
adler2 = { workspace = true }
unicode-normalization = { workspace = true }
ml-dsa = { workspace = true }
ml-kem = { workspace = true }
sha3 = { workspace = true }
rand_core = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

# Optional HRT backends — must be marked optional here (not in workspace.dependencies)
cryptoki  = { workspace = true, optional = true }
aws-sdk-kms = { workspace = true, optional = true }
aws-config  = { workspace = true, optional = true }
gcloud-sdk  = { workspace = true, optional = true }

[features]
default = []
hrt-pkcs11 = ["dep:cryptoki"]
hrt-aws-kms = ["dep:aws-sdk-kms", "dep:aws-config"]
hrt-gcp-kms = ["dep:gcloud-sdk"]
hrt-tpm = []
hrt-sgx = []
audit-plaintext = []
unsafe-structural-only = []
