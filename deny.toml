# cargo deny configuration for SAACP (opusreview.md M5 / §2.3).
#
# This file configures `cargo deny check` — a supply-chain audit tool that
# runs in CI on every push and PR. It checks four categories:
#
# 1. Advisories:  crates with known CVEs or unmaintained status
# 2. Bans:        crates that are explicitly forbidden
# 3. Licenses:    license compatibility enforcement
# 4. Sources:     where dependencies are allowed to come from

# ── Advisories ────────────────────────────────────────────────────────────────
# Check the RustSec advisory database for known vulnerabilities.
[advisories]
# Ignore advisories that are withdrawn, unaffected, or remediated via
# an explicit compensating control. Each entry carries a justification
# and a tracked remediation path.
#
# All four entries below come from the AWS SDK's transitive dependency
# chain: aws-smithy-runtime/aws-smithy-http-client pull in rustls 0.21
# and h2 0.3, which carry the CVEs below. They are ONLY reachable when
# the `hrt-aws-kms` feature is enabled. Upgrading the AWS SDK to a
# version that drops these deps is tracked in opusreview.md §2.8 / M21.
# Re-check on every quarterly review or when a new AWS SDK major ships.
ignore = [
    # rustls-webpki 0.101.7 → URI name constraint bypass
    # Affects: TLS cert validation when hrt-aws-kms is enabled.
    # Remediation: AWS SDK upgrade (M21). Compensating: no external TLS
    # endpoints are served through the aws-smithy-runtime path.
    { id = "RUSTSEC-2026-0098", reason = "AWS SDK transitive — remediation tracked in M21 (aws-sdk upgrade)" },

    # rustls-webpki 0.101.7 → wildcard name constraint bypass
    # Same chain and remediation as RUSTSEC-2026-0098.
    { id = "RUSTSEC-2026-0099", reason = "AWS SDK transitive — remediation tracked in M21" },

    # rustls-webpki 0.101.7 → CRL parsing reachable panic
    # Same chain and remediation as RUSTSEC-2026-0098.
    { id = "RUSTSEC-2026-0104", reason = "AWS SDK transitive — remediation tracked in M21" },

    # h2 0.3.27 → unbounded empty DATA frames (DoS)
    # Affects: HTTP/2 client via aws-smithy-http-client when hrt-aws-kms
    # is enabled. Compensating: the KMS endpoint is an outbound client
    # connection, not an inbound server; the attack requires a malicious
    # server, which is Amazon KMS — highly unlikely in practice.
    { id = "RUSTSEC-2026-0258", reason = "AWS SDK transitive — remediation tracked in M21" },
]
# Emit a warning (not an error) when an ignored advisory is not detected
# in the current build. This is expected for --all-features-only advisories
# like the AWS SDK CVEs above, which are absent in a default-feature build.
unused-ignored-advisory = "warn"

# ── Bans ──────────────────────────────────────────────────────────────────────
# Deny specific crates by name or version range.
[bans]
# Deny multiple versions of the same crate. Each duplicate is a deliberate,
# reviewed decision (see `skip` below).
multiple-versions = "deny"

# Dependencies that are allowed to appear multiple times. Each entry is a
# reviewed exception — see the inline justification.
#
# ── Review policy (audit R7 mitigation) ─────────────────────────────────────
# Every `skip` entry below carries a `reviewed:` date. A duplicate-version
# exception is a *debt marker*, not a permanent grant: when a security fix
# ships in only the newer copy of a duplicated crate, the older copy in the
# same tree silently misses the advisory fix (cargo-deny can only exempt what
# it is told to). Each entry must be re-justified at least once per quarter —
# if the upstream unification tracked in opusreview.md §2.8 / M21 lands
# first, delete the entry entirely.
skip = [
    # `rand 0.8.6` required by ed25519-dalek 2.x / tungstenite.
    # reviewed: 2026-09-13 — no rand 0.8.x-only advisory; blocked upstream.
    { name = "rand" },

    # `sha3 0.10.9` (our direct dep) vs `sha3 0.11.0` pulled by ml-kem 0.3.
    # reviewed: 2026-09-13 — no sha3 0.10.x-only advisory; ml-kem pins 0.11.
    { name = "sha3" },

    # `signature 2.2.0` (ed25519-dalek) vs `signature 3.0.0` (ml-dsa).
    # reviewed: 2026-09-13 — no signature 2.x-only advisory.
    { name = "signature" },

    # `rand_core 0.6.x` (ed25519-dalek transitive) vs `rand_core 0.10.x`.
    # reviewed: 2026-09-13 — no rand_core 0.6.x-only advisory.
    { name = "rand_core" },

    # `crypto-common 0.1.x` (sha2/hmac) vs `crypto-common 0.2.x` (ml-kem).
    # reviewed: 2026-09-13 — no advisory.
    { name = "crypto-common" },

    # `digest 0.10.x` vs `digest 0.11.x` (ml-kem/ml-dsa split).
    # reviewed: 2026-09-13 — no advisory.
    { name = "digest" },

    # `getrandom 0.2.x` (rand 0.8 transitive) vs `getrandom 0.4.x`.
    # reviewed: 2026-09-13 — no advisory.
    { name = "getrandom" },

    # `block-buffer 0.10.x` vs `block-buffer 0.11.x` (sha3 version split).
    # reviewed: 2026-09-13 — no advisory.
    { name = "block-buffer" },

    # `cpufeatures 0.2.x` vs `cpufeatures 0.3.x` (sha3 version split).
    # reviewed: 2026-09-13 — no advisory.
    { name = "cpufeatures" },

    # `keccak 0.1.x` vs `keccak 0.2.x` (sha3 0.10 vs sha3 0.11 split).
    # reviewed: 2026-09-13 — no advisory.
    { name = "keccak" },

    # `axum 0.7.9` and `axum 0.8.9` — sidecar vs command-center feature split.
    # reviewed: 2026-09-05 — no 0.7.x-only advisory; both majors maintained.
    { name = "axum" },

    # `rustls 0.21.12` — AWS SDK transitive (hrt-aws-kms feature). EOL upstream;
    # HIGHEST-priority entry to re-check quarterly. Tracked in M21.
    # reviewed: 2026-09-05
    { name = "rustls" },

    # `tokio-rustls 0.24.1` — same transitive path as rustls 0.21.
    # reviewed: 2026-09-05 — same EOL exposure as the rustls 0.21 entry.
    { name = "tokio-rustls" },

    # `hyper 0.14` and `h2 0.3` — AWS SDK transitive (hrt-aws-kms).
    # reviewed: 2026-09-05 — h2 0.3 has past HTTP/2 rapid-reset advisories;
    # re-check this entry on every h2 advisory.
    { name = "hyper" },
    { name = "h2" },
]

# ── Licenses ──────────────────────────────────────────────────────────────────
# Enforce license compatibility. SAACP is MIT-licensed; dependencies must
# be compatible with MIT distribution.
[licenses]
# The confidence threshold for license detection (0.0 - 1.0).
confidence-threshold = 0.9

# Allowed licenses. MIT, Apache-2.0, BSD-2/3-Clause, ISC, Unicode-3.0,
# and OpenSSL (for the OpenSSL crate itself) are all MIT-compatible.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
]

# Exceptions for crates with non-standard licensing that are verified
# compatible. Each entry must be reviewed and justified.
exceptions = [
    # Example: { allow = ["GPL-3.0"], name = "some-crate" },
]

# ── Sources ──────────────────────────────────────────────────────────────────
# Control where dependencies can be sourced from.
[sources]
# Deny crates from unknown registries (only crates.io is allowed).
unknown-registry = "deny"

# Deny crates from unknown git repositories.
unknown-git = "deny"

# Allow crates from the official crates.io registry.
[sources.allow-org]
github = []  # No GitHub organizations allowed by default
