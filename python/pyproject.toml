[project]
name = "saacp-client"
version = "0.1.0"
description = "Thin HTTP client for the saacp-sidecar proxy — secure agent-to-agent messaging with zero SAACP protocol knowledge on the Python side"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = ["requests>=2.28"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["saacp_client*"]
