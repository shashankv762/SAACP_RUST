apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-sidecar
  labels:
    app.kubernetes.io/name: saacp-sidecar
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  serviceName: {{ .Release.Name }}-sidecar
  replicas: {{ .Values.sidecar.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: saacp-sidecar
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: saacp-sidecar
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: saacp-sidecar
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/saacp-sidecar"]
          ports:
            - containerPort: {{ .Values.sidecar.port }}
              name: saacp
              protocol: TCP
            - containerPort: {{ .Values.sidecar.httpPort }}
              name: http
              protocol: TCP
          {{- if .Values.health.enabled }}
            - containerPort: {{ .Values.health.port }}
              name: health
              protocol: TCP
          {{- end }}
          env:
            - name: SAACP_LISTEN_ADDR
              value: "0.0.0.0:{{ .Values.sidecar.port }}"
            - name: SAACP_HTTP_ADDR
              value: "127.0.0.1:{{ .Values.sidecar.httpPort }}"
            - name: SAACP_TOKEN_SECRET_FILE
              value: /run/secrets/saacp/token-secret
            - name: SAACP_PEER_SECRETS_FILE
              value: /run/secrets/saacp/peers.json
            - name: SAACP_REQUIRE_PEER_SECRETS
              value: "1"
            - name: SAACP_HANDSHAKE_MODE
              value: PREFER_PINNED
            {{- if and .Values.secrets.redisUrl.secretName (ne .Values.secrets.redisUrl.secretName "") }}
            - name: SAACP_STATE_BACKEND_URL_FILE
              value: /run/secrets/saacp/redis-url
            {{- end }}
          {{- if .Values.health.enabled }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- end }}
          resources:
            {{- toYaml .Values.sidecar.resources | nindent 12 }}
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets/saacp
              readOnly: true
      volumes:
        - name: secrets
          projected:
            sources:
              - secret:
                  name: {{ .Values.secrets.tokenSecret.secretName }}
                  items:
                    - key: {{ .Values.secrets.tokenSecret.key }}
                      path: token-secret
              - secret:
                  name: {{ .Values.secrets.peerSecrets.secretName }}
                  items:
                    - key: {{ .Values.secrets.peerSecrets.key }}
                      path: peers.json
              {{- if and .Values.secrets.redisUrl.secretName (ne .Values.secrets.redisUrl.secretName "") }}
              - secret:
                  name: {{ .Values.secrets.redisUrl.secretName }}
                  items:
                    - key: {{ .Values.secrets.redisUrl.key }}
                      path: redis-url
              {{- end }}
